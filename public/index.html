<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TikTokCraft Bridge</title>
<style>
  :root{ --pink:#ff2d78; --cyan:#25f4ee; --bg:#0c0f14; --card:#151a22; --ok:#2ecc71; --off:#555f70; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:#eef2f7;font-family:'Segoe UI',Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:20px;margin:0 0 2px;}
  h1 .accent{color:var(--pink);}
  .sub{color:#8a93a6;font-size:12.5px;margin-bottom:22px;}
  .card{background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);
    box-shadow:0 8px 20px rgba(0,0,0,.3);padding:20px;margin-bottom:16px;}
  label{display:block;font-size:12px;color:#9aa3b5;margin:12px 0 4px;}
  label:first-of-type{margin-top:0;}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
    background:#0e131b;color:#eef2f7;font-size:13.5px;}
  input:disabled{color:#5b6475;cursor:not-allowed;}
  .row2{display:flex;gap:12px;}
  .row2 > div{flex:1;}
  .btns{display:flex;gap:10px;margin-top:18px;}
  button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;}
  #save{background:#2a3242;color:#eef2f7;}
  #start{background:var(--ok);color:#06220f;}
  #stop{background:#e74c3c;color:#2b0a06;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .status{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off);}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .log{background:#0a0d12;border-radius:10px;border:1px solid rgba(255,255,255,.06);
    padding:12px;height:220px;overflow-y:auto;font-family:'Consolas','Menlo',monospace;
    font-size:11.5px;color:#9fe6ff;white-space:pre-wrap;}
  .hint{font-size:11px;color:#5b6475;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>TikTok<span class="accent">Craft</span> Bridge</h1>
  <div class="sub">Conecta tu LIVE de TikTok con tu servidor de Minecraft por RCON</div>

  <div class="card">
    <label>Usuario de TikTok (sin @)</label>
    <input id="tiktokUsername" placeholder="tu_usuario">

    <label>signApiKey (eulerstream.com)</label>
    <input id="signApiKey" disabled>
    <div class="hint">Este campo no se edita aquí. Si necesitas cambiarlo, abre config.json con el Bloc de notas.</div>

    <div class="row2">
      <div>
        <label>Host / IP del servidor (RCON)</label>
        <input id="rconHost" placeholder="mi.servidor.com">
      </div>
      <div>
        <label>Puerto RCON</label>
        <input id="rconPort" placeholder="25575">
      </div>
    </div>

    <label>Contraseña RCON</label>
    <input id="rconPassword" type="password" placeholder="rcon.password">

    <div class="btns">
      <button id="save">Guardar</button>
    </div>
  </div>

  <div class="card">
    <div class="status"><div class="dot" id="dot"></div><span id="statusText">Detenido</span></div>
    <div class="btns">
      <button id="start">▶ Iniciar</button>
      <button id="stop">■ Detener</button>
    </div>
  </div>

  <div class="card">
    <label style="margin-top:0">Registro</label>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadConfig() {
  const r = await fetch('/api/config');
  const c = await r.json();
  $('tiktokUsername').value = c.tiktokUsername;
  $('signApiKey').value = c.signApiKeyMasked;
  $('rconHost').value = c.rcon.host;
  $('rconPort').value = c.rcon.port;
  $('rconPassword').value = c.rcon.password;
}

$('save').onclick = async () => {
  await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tiktokUsername: $('tiktokUsername').value.trim(),
      rconHost: $('rconHost').value.trim(),
      rconPort: $('rconPort').value.trim(),
      rconPassword: $('rconPassword').value,
    }),
  });
  $('save').textContent = 'Guardado ✓';
  setTimeout(() => ($('save').textContent = 'Guardar'), 1200);
};

$('start').onclick = async () => { await fetch('/api/start', { method: 'POST' }); refresh(); };
$('stop').onclick = async () => { await fetch('/api/stop', { method: 'POST' }); refresh(); };

async function refresh() {
  const r = await fetch('/api/status');
  const s = await r.json();
  $('dot').classList.toggle('on', s.running);
  $('statusText').textContent = s.running ? 'En marcha' : 'Detenido';
  $('start').disabled = s.running;
  $('stop').disabled = !s.running;
  const logEl = $('log');
  const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.textContent = s.logs.join('\n');
  if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
}

loadConfig();
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
